models:
  qwen3-8b:
    model_id: Qwen/Qwen3-8B
    family: qwen3
    revision: null   # MUST be frozen to a commit SHA before the final test campaign
    dtype: bfloat16
    load_in_4bit: true
    quantization: nf4
    double_quant: true
    device_map: auto
    trust_remote_code: false
    max_context: 32768
    enable_thinking: false
    notes: >-
      Main Qwen condition. Transformers >=4.51.0 is required. Use non-thinking mode
      for the primary campaign so the observable scoring path and budgets remain comparable.

  mistral7b:
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    family: mistral
    revision: null   # MUST be frozen to a commit SHA before the final test campaign
    dtype: bfloat16
    load_in_4bit: true
    quantization: nf4
    double_quant: true
    device_map: auto
    trust_remote_code: false
    max_context: 32768
    enable_thinking: false
    notes: >-
      Second open-weight backbone. Apache-2.0 model family with a 32k position limit.
      Use the same 32k experiment cap, 4-bit NF4 configuration, and frozen decoding
      budget as the Qwen condition. Record the exact Hugging Face snapshot SHA before test.
